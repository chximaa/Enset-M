<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tp2 ex3</title>
</head>
<body>
    <script>
        let tab=[];
        let somme=0;
        for (i=0; i<8; i++){
            tab[i] = parseFloat(prompt("Entrez une note entre 0 et 20 : "));
            if (tab[i]<0 || tab[i]>20){
                alert("La note doit etre entre 0 et 20");
                i--;
            }
            else{
                somme += tab[i];
            }
        }

        console.log(tab);
        let moyenne = somme/8;
        console.log(`La moyenne des notes est : ${moyenne}`);
        let nbr=0;
        for (i=0; i<8; i++){
            if (tab[i] >= 10){
                nbr++;
            }
        }
        console.log(`Le nombre de notes superieures ou egales a la moyenne est : ${nbr}`);
        
        // for (i=0; i<8; i++){
        //     if (tab[i] > moyenne){
        //         console.log(`La note ${tab[i]} est superieure a la moyenne`);
        //     }
        // }

    </script>
</body>
</html>
