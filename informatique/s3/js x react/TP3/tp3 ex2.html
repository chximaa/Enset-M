<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tp3 ex2</title>
</head>
<body>
    <script>
        const formatNom = (prenom, nom) => nom +", " + prenom; //`${nom}, ${prenom}`;

        let prenom = prompt("Entrez votre prénom :");
        let nom = prompt("Entrez votre nom :");
            
        let nomComplet = formatNom(prenom, nom);
        console.log(nomComplet.length > 15 ? "Nom long" : nomComplet);
    </script>
</body>
</html>
